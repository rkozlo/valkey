- name: Test key_patterns
  block:
    - name: Create test user with key_patterns
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        key_patterns:
          - "cache:*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Check user actual keys
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['keys'] == ['~cache:*']

    - name: Alter test user with key_patterns append new pattern
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        key_patterns:
          - "php:*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Alter test user with key_patterns append new pattern - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        key_patterns:
          - "php:*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Check user actual keys
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['keys'] == ['~cache:*', '~php:*']

    - name: Alter test user with key_patterns and reset key patterns
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        key_patterns:
          - "%rw~web:*"
          - "%w~db:*"
          - "%r~mon:*"
        reset_key_patterns: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Ensure user is dropedd
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Alter test user with key_patterns and reset key patterns - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        key_patterns:
          - "%rw~web:*"
          - "%w~db:*"
          - "%r~mon:*"
        reset_key_patterns: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Check user actual keys
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['keys'] == ['~web:*', '%W~db:*', '%R~mon:*']

    - name: Drop test user
      rkozlo.valkey.valkey_user:
        name: test_user
        state: absent
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Ensure user is dropedd
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result | length == 0

- name: Test channels
  block:
    - name: Create test user with channels
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "chatbot*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True
          - result.executed_statements[0]['params']['channels'] == ['chatbot*']

    - name: Check user actual channels
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['channels'] == ['&chatbot*']

    - name: Create test user with channels - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "chatbot*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Alter test user with channels append new channel
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "php*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True
          - result.executed_statements[0]['params']['channels'] == ['php*']

    - name: Check user actual channels
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['channels'] == ['&chatbot*', '&php*']

    - name: Alter test user with channels append one existing - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "php*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Alter test user with channels append two existing - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "php*"
          - "chatbot*"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Alter test user with channels add third channel
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "web"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True
          - result.executed_statements[0]['params']['channels'] == ['web']

    - name: Check user actual channels
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['channels'] == ['&chatbot*', '&php*', '&web']

    - name: Alter test user with channels add third channel -idemportency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        channels:
          - "web"
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Alter test user with channels add all three channels unorderd - idemportency
      rkozlo.valkey.valkey_user:
