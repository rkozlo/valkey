- name: Test passwords
  block:
    - name: Create user with password and reset password in real mode
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        passwords:
          - test_pass
        reset_passwords: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Create user with password and reset password in real mode - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        passwords:
          - test_pass
        reset_passwords: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == False

    - name: Check user actuall password
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['passwords'] == ['ba230eb5f5d3cca32e0ef26ed2dc0da5af07ba429d1e824902169fc56fb02e6c']

    - name: Alter user with password and reset password, password changed in real mode
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        passwords:
          - test_pass2
        reset_passwords: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Check user actual password
      rkozlo.valkey.valkey_exec:
        command: ACL_GETUSER
        params:
          username: test_user
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.result['passwords'] == ['432f958653128007d836c8d88852deb53e4c4df54bf277489168feea88df3e25']

    - name: Alter user with password and reset password, password changed in real mode
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        hashed_passwords:
          - ba230eb5f5d3cca32e0ef26ed2dc0da5af07ba429d1e824902169fc56fb02e6c
        reset_passwords: true
      register: result

    - name: Check result
      ansible.builtin.assert:
        that:
          - result.changed == True

    - name: Alter user with password and reset password, password changed in real mode - idempotency
      rkozlo.valkey.valkey_user:
        name: test_user
        state: present
        hashed_passwords:
          - ba230eb5f5d3cca32e0ef26ed2dc0da5af07ba429d1e824902169fc56fb02e6c
        reset_passwords: true
      register: result

    - name: Check result
      ansible.builtin.assert:
