- name: Create list of test cases for valkey_user module
  ansible.builtin.set_fact:
    test_cases:
      - name: test_user_1
        enabled: true
        passwords: ['test_pass']
        __expected_query: {"action": "create_user", "params": {"username": "test_user_1", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_1", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_1"]}
      - name: test_user_2
        enabled: true
        passwords: ['test_pass']
        __expected_query: {"action": "create_user", "params": {"username": "test_user_2", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_2", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_2"]}
      - name: test_user_4
        enabled: true
        hashed_passwords: ['10a6e6cc8311a3e2bcc09bf6c199adecd5dd59408c343e926b129c4914f3cb01']
        __expected_query: {"action": "create_user", "params": {"username": "test_user_4", "enabled": true, "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_4", "enabled": true, "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_4"]}
      - name: test_user_5
        enabled: true
        passwords: ['ansi']
        hashed_passwords: ['10a6e6cc8311a3e2bcc09bf6c199adecd5dd59408c343e926b129c4914f3cb01']
        __expected_query: {"action": "create_user", "params": {"username": "test_user_5", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_5", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_5"]}
      - name: test_user_6
        enabled: true
        passwords: ['ansi']
        hashed_passwords: ['10a6e6cc8311a3e2bcc09bf6c199adecd5dd59408c343e926b129c4914f3cb01']
        reset_passwords: true
        __expected_query: {"action": "create_user", "params": {"username": "test_user_6", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_6", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": true, "reset_keys": false, "reset_channels": false}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_6"]}
      - name: test_user_7
        enabled: true
        passwords: ['ansi']
        hashed_passwords: ['10a6e6cc8311a3e2bcc09bf6c199adecd5dd59408c343e926b129c4914f3cb01']
        categories: ['+@all']
        reset_passwords: false
        __expected_query: {"action": "create_user", "params": {"username": "test_user_7", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false, "categories": ['+@all']}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_7", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "hashed_passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false, "categories": ['+@all']}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_7"]}
      - name: test_user_8
        enabled: true
        passwords: ['ansi']
        categories: ['+@all']
        reset_passwords: false
        reset_categories: true
        __expected_query: {"action": "create_user", "params": {"username": "test_user_8", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false, "categories": ['+@all']}}
        __expected_alter: {"action": "update_user", "params": {"username": "test_user_8", "enabled": true, "passwords": ['+{{ hidden_secret }}'], "reset_passwords": false, "reset_keys": false, "reset_channels": false, "categories": ['+@all']}}
        __expected_drop: {"action": "delete_user", "args": ["test_user_8"]}

- name: Create plain test user in check mode
  rkozlo.valkey.valkey_user:
    name: test_user
  check_mode: true
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed == True
      - result.executed_statements | length == 2
      - >-
        result.executed_statements[0].params == {
          'username': 'test_user',
          'enabled': True,
          'reset_passwords': False,
          'reset_keys': False,
          'reset_channels': False
        }
      - result.executed_statements[1].action == 'acl_save'

- name: Check user is not created
  rkozlo.valkey.valkey_exec:
    command: ACL_GETUSER
    params:
      username: test_user
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.result == []

- name: Create plain test user in real mode
  rkozlo.valkey.valkey_user:
    name: test_user
  register: result

- name: Check result
  ansible.builtin.assert:
    that:
      - result.changed == True
      - result.executed_statements | length == 2
      - result.executed_statements[0].action == 'create_user'
      - >-
        result.executed_statements[0].params == {
          'username': 'test_user',
          'enabled': True,
          'reset_passwords': False,
          'reset_keys': False,
          'reset_channels': False
        }
      - result.executed_statements[1].action == 'acl_save'

- name: Check user is created
  rkozlo.valkey.valkey_exec:
